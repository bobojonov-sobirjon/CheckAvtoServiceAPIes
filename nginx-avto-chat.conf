# CheckAvto Nginx Configuration with WebSocket Support

upstream django {
    server unix:/run/avto/avto.sock;
}

upstream daphne {
    server unix:/run/avto/avto-chat.sock;
}

server {
    listen 80;
    server_name your_domain.com;  # CHANGE THIS
    
    charset utf-8;
    client_max_body_size 75M;

    # Static files
    location /static/ {
        alias /var/www/CheckAvtoServiceAPIes/staticfiles/;
    }

    # Media files
    location /media/ {
        alias /var/www/CheckAvtoServiceAPIes/media/;
    }

    # WebSocket connections (Django Channels/Daphne)
    location /ws/ {
        proxy_pass http://daphne;
        
        # WebSocket headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings for WebSocket
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_connect_timeout 60s;
        
        # Buffer settings
        proxy_buffering off;
    }

    # Regular HTTP requests (Django/Gunicorn)
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
