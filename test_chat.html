<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat WebSocket Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            margin-bottom: 5px;
        }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .status.connected {
            background: #10b981;
        }
        
        .status.disconnected {
            background: #ef4444;
        }
        
        .config {
            padding: 20px;
            background: #f3f4f6;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #374151;
        }
        
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }
        
        .message {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .message.system {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
        }
        
        .message.sent {
            background: #ddd6fe;
            border-left: 4px solid #8b5cf6;
        }
        
        .message.received {
            background: #d1fae5;
            border-left: 4px solid #10b981;
        }
        
        .message.error {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
        }
        
        .message-time {
            font-size: 12px;
            color: #6b7280;
            margin-top: 5px;
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
        }
        
        .message-form {
            display: flex;
            gap: 10px;
        }
        
        .message-form input {
            flex: 1;
        }
        
        .typing-indicator {
            padding: 10px 20px;
            font-size: 14px;
            color: #6b7280;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 WebSocket Chat Test</h1>
            <p>CheckAvto Real-Time Chat</p>
            <span class="status disconnected" id="status">🔴 Disconnected</span>
        </div>
        
        <div class="config">
            <div class="form-group">
                <label for="serverUrl">Server URL:</label>
                <input type="text" id="serverUrl" value="ws://localhost:8000" placeholder="ws://localhost:8000">
            </div>
            
            <div class="form-group">
                <label for="roomId">Room ID:</label>
                <input type="number" id="roomId" value="1" placeholder="1">
            </div>
            
            <div class="form-group">
                <label for="token">JWT Token (Access Token):</label>
                <input type="text" id="token" placeholder="eyJ0eXAiOiJKV1QiLCJhbGc...">
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" onclick="connect()" id="connectBtn">🔌 Connect</button>
                <button class="btn btn-danger" onclick="disconnect()" id="disconnectBtn" disabled>❌ Disconnect</button>
                <button class="btn" onclick="clearMessages()">🗑️ Clear</button>
            </div>
        </div>
        
        <div class="messages" id="messages">
            <div class="message system">
                <strong>💡 Instructions:</strong><br>
                1. Enter your JWT token (get it from /api/accounts/login/)<br>
                2. Enter room ID (create room via /api/chat/rooms/)<br>
                3. Click "Connect"<br>
                4. Start sending messages!
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator"></div>
        
        <div class="input-area">
            <div class="message-form">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type a message..." 
                    disabled
                    onkeyup="handleTyping(event)"
                >
                <button class="btn btn-success" onclick="sendMessage()" id="sendBtn" disabled>📤 Send</button>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let typingTimer = null;

        function addMessage(type, content) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const time = new Date().toLocaleTimeString();
            messageDiv.innerHTML = `${content}<div class="message-time">${time}</div>`;
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(connected) {
            const statusEl = document.getElementById('status');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            
            if (connected) {
                statusEl.textContent = '🟢 Connected';
                statusEl.className = 'status connected';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                messageInput.disabled = false;
                sendBtn.disabled = false;
            } else {
                statusEl.textContent = '🔴 Disconnected';
                statusEl.className = 'status disconnected';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                messageInput.disabled = true;
                sendBtn.disabled = true;
            }
        }

        function connect() {
            const serverUrl = document.getElementById('serverUrl').value;
            const roomId = document.getElementById('roomId').value;
            const token = document.getElementById('token').value;
            
            if (!token) {
                alert('Please enter JWT token!');
                return;
            }
            
            if (!roomId) {
                alert('Please enter room ID!');
                return;
            }
            
            const wsUrl = `${serverUrl}/ws/chat/${roomId}/?token=${token}`;
            
            addMessage('system', `🔌 Connecting to: ${wsUrl}`);
            
            try {
                socket = new WebSocket(wsUrl);
                
                socket.onopen = (event) => {
                    updateStatus(true);
                    addMessage('system', '✅ <strong>Connected successfully!</strong>');
                };
                
                socket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    console.log('Received:', data);
                    
                    switch(data.type) {
                        case 'connection_established':
                            addMessage('system', `✅ ${data.message}`);
                            break;
                            
                        case 'chat_message':
                            const msg = data.message;
                            addMessage('received', 
                                `<strong>${msg.sender?.full_name || 'Unknown'}:</strong><br>
                                ${msg.text || msg.message_type}`
                            );
                            break;
                            
                        case 'typing':
                            const typingEl = document.getElementById('typingIndicator');
                            if (data.is_typing) {
                                typingEl.textContent = `✏️ User is typing...`;
                            } else {
                                typingEl.textContent = '';
                            }
                            break;
                            
                        case 'read_receipt':
                            addMessage('system', `✔️ Message ${data.message_id} marked as read`);
                            break;
                            
                        default:
                            addMessage('received', `📩 ${JSON.stringify(data, null, 2)}`);
                    }
                };
                
                socket.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    addMessage('error', `❌ <strong>Error:</strong> ${error.message || 'Connection failed'}`);
                };
                
                socket.onclose = (event) => {
                    updateStatus(false);
                    addMessage('error', `🔌 <strong>Connection closed</strong><br>Code: ${event.code}<br>Reason: ${event.reason || 'Unknown'}`);
                };
                
            } catch (error) {
                addMessage('error', `❌ <strong>Error:</strong> ${error.message}`);
            }
        }

        function disconnect() {
            if (socket) {
                socket.close();
                socket = null;
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text || !socket) return;
            
            const message = {
                type: 'chat_message',
                message_type: 'text',
                text: text
            };
            
            socket.send(JSON.stringify(message));
            addMessage('sent', `<strong>You:</strong><br>${text}`);
            
            input.value = '';
        }

        function handleTyping(event) {
            if (event.key === 'Enter') {
                sendMessage();
                return;
            }
            
            if (!socket) return;
            
            // Clear previous timer
            clearTimeout(typingTimer);
            
            // Send typing indicator
            socket.send(JSON.stringify({
                type: 'typing',
                is_typing: true
            }));
            
            // Stop typing after 1 second of inactivity
            typingTimer = setTimeout(() => {
                socket.send(JSON.stringify({
                    type: 'typing',
                    is_typing: false
                }));
            }, 1000);
        }

        function clearMessages() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '<div class="message system">Messages cleared.</div>';
        }

        // Auto-fill token from localStorage if available
        window.onload = () => {
            const savedToken = localStorage.getItem('jwt_token');
            if (savedToken) {
                document.getElementById('token').value = savedToken;
            }
        };

        // Save token to localStorage when changed
        document.getElementById('token').addEventListener('input', (e) => {
            localStorage.setItem('jwt_token', e.target.value);
        });
    </script>
</body>
</html>
